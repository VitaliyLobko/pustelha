<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f80b4"/>
      <stop offset="1" stop-color="#3a5788"/>
    </linearGradient>
    <!-- крило: махові вигнутими лезами, вершини загинаються досередини — як бічні зубці тризуба -->

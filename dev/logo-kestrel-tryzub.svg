      <path d="M122,306 C108,236 112,160 162,104 C150,150 146,220 146,306 Z"/>
      <path d="M152,306 C142,248 146,186 186,132 C176,174 172,236 172,306 Z"/>
      <path d="M178,306 C170,258 174,208 206,158 C198,196 196,250 196,306 Z"/>
      <path d="M202,306 C196,268 200,228 224,186 C218,218 218,262 218,306 Z"/>
      <path d="M118,298 H234 V354 H196 C150,354 118,334 118,298 Z"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(256 262) scale(.9) translate(-256 -262)">
    <g fill="#fff">
      <use href="#wing"/>
      <use href="#wing" transform="translate(512,0) scale(-1,1)"/>

      <!-- хвіст віялом -->
      <path d="M228,356 H242 C240,380 236,402 228,424 C220,422 214,418 210,414 C218,396 224,376 228,356 Z"/>
      <path d="M249,356 H263 C264,384 262,410 256,436 C250,410 248,384 249,356 Z"/>
      <path d="M270,356 H284 C288,376 294,396 302,414 C298,418 292,422 284,424 C276,402 272,380 270,356 Z"/>

      <!-- голова і тулуб: центральний зубець -->
      <path d="M256,74 C268,92 282,110 278,128 C276,138 270,144 268,150 C286,172 288,212 284,252 L278,352 H234 L228,252 C224,212 226,172 244,150 C242,144 236,138 234,128 C230,110 244,92 256,74 Z"
            stroke="#4a6a9e" stroke-width="8" paint-order="stroke"/>
    </g>
    <!-- очі і «вуса» пустельги — вирізом -->
    <g fill="#4a6a9e">
      <path d="M247,110 c4,0 7,3 7,6 c-4,1 -8,0 -10,-3 c0,-2 1,-3 3,-3 Z M265,110 c-4,0 -7,3 -7,6 c4,1 8,0 10,-3 c0,-2 -1,-3 -3,-3 Z"/>
      <path d="M244,122 c2,6 4,12 4,19 c-3,-2 -6,-6 -6,-10 c0,-4 1,-7 2,-9 Z M268,122 c-2,6 -4,12 -4,19 c3,-2 6,-6 6,-10 c0,-4 -1,-7 -2,-9 Z"/>
